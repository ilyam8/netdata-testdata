---
name: Prometheus Evidence Immutability

on:
  pull_request: null

permissions:
  contents: read

concurrency:
  group: prometheus-evidence-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  immutable-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify LF storage contract
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -d '' -t attributes < <(
            {
              printf '%s\0' .gitattributes
              git ls-files -z -- prometheus
            } | git check-attr --stdin -z eol
          )
          test "$((${#attributes[@]} % 3))" -eq 0
          for ((index = 0; index < ${#attributes[@]}; index += 3)); do
            path=${attributes[index]}
            attribute=${attributes[index + 1]}
            value=${attributes[index + 2]}
            if [[ "${attribute}" != eol || "${value}" != lf ]]; then
              echo "Prometheus evidence must check out with LF line endings: ${path}: ${attribute}: ${value}" >&2
              exit 1
            fi
          done

      - name: Reject changes to existing evidence
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euxo pipefail

          if git diff --quiet --diff-filter=MDRT "${BASE_SHA}"...HEAD -- prometheus/profiles; then
            :
          else
            echo 'Existing Prometheus evidence paths are immutable.' >&2
            git diff --name-status --diff-filter=MDRT "${BASE_SHA}"...HEAD -- prometheus/profiles >&2
            exit 1
          fi

          while IFS= read -r -d '' path; do
            relative=${path#prometheus/profiles/}
            if [[ "${relative}" != */* ]]; then
              echo "Prometheus evidence must be added below a profile-revision directory: ${path}" >&2
              exit 1
            fi
            directory=${relative%%/*}
            if git cat-file -e "${BASE_SHA}:prometheus/profiles/${directory}" 2>/dev/null; then
              echo "Add changed evidence under a new profile-revision directory; ${directory} already exists." >&2
              exit 1
            fi
          done < <(git diff --name-only --diff-filter=A -z "${BASE_SHA}"...HEAD -- prometheus/profiles)
